name: Publish APT Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  build-deb:
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: amd64
            runner: ubuntu-24.04
          - name: arm64
            runner: ubuntu-24.04-arm
        distro:
          - image: "ubuntu:20.04"
            codename: focal
            judy_dep: libjudy1
            jsonc_dep: libjson-c4
          - image: "ubuntu:22.04"
            codename: jammy
            judy_dep: libjudy1
            jsonc_dep: libjson-c5
          - image: "ubuntu:24.04"
            codename: noble
            judy_dep: libjudydebian1
            jsonc_dep: libjson-c5
          - image: "ubuntu:26.04"
            codename: resolute
            judy_dep: libjudydebian1
            jsonc_dep: libjson-c5
          - image: "debian:bullseye"
            codename: bullseye
            judy_dep: libjudy1
            jsonc_dep: libjson-c5
          - image: "debian:bookworm"
            codename: bookworm
            judy_dep: libjudydebian1
            jsonc_dep: libjson-c5
          - image: "debian:trixie"
            codename: trixie
            judy_dep: libjudydebian1
            jsonc_dep: libjson-c5
          - image: "debian:forky"
            codename: forky
            judy_dep: libjudydebian1
            jsonc_dep: libjson-c5

    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine package version
        id: version
        run: |
          CMAKE_VERSION=$(grep 'set(ZMAP_VERSION' CMakeLists.txt | sed 's/.*set(ZMAP_VERSION //; s/[) ].*//')
          if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ inputs.environment }}" == "production" ]]; then
            if [[ "$CMAKE_VERSION" == "DEVELOPMENT" ]]; then
              echo "::error::CMakeLists.txt version is still 'DEVELOPMENT'. Set ZMAP_VERSION before releasing."
              exit 1
            fi
            echo "version=$CMAKE_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=0~dev+$(date +%Y%m%d).$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .deb in target distro container
        run: |
          docker run --rm \
            -v "$(pwd):/src" \
            -w /src \
            "${{ matrix.distro.image }}" \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y \
                build-essential cmake libgmp3-dev gengetopt \
                libpcap-dev flex byacc libjson-c-dev \
                pkg-config libunistring-dev libjudy-dev
              cmake \
                -DZMAP_VERSION='${{ steps.version.outputs.version }}' \
                -DCMAKE_BUILD_TYPE=Release \
                -DJUDY_RUNTIME_DEP='${{ matrix.distro.judy_dep }}' \
                -DJSONC_RUNTIME_DEP='${{ matrix.distro.jsonc_dep }}' \
                -DDISTRO_CODENAME='${{ matrix.distro.codename }}' \
                .
              make -j\$(nproc)
              cpack
            "
          sudo chown "$(id -u):$(id -g)" zmap_*.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: zmap-deb-${{ matrix.distro.codename }}-${{ matrix.arch.name }}
          path: 'zmap_*.deb'

  publish-apt:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Set target bucket
        id: bucket
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "name=zmap-apt-repo" >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "name=zmap-apt-repo" >> "$GITHUB_OUTPUT"
          else
            echo "name=zmap-apt-repo-staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Download deb artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: zmap-deb-*
          merge-multiple: true
          path: new-debs/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Install repo tools
        run: sudo apt-get install -y dpkg-dev

      - name: Import GPG signing key
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud secrets versions access latest \
            --secret=zmap-apt-signing-key \
            --project="$GCP_PROJECT_ID" \
            > /tmp/signing-key.asc
          gpg --import /tmp/signing-key.asc
          rm -f /tmp/signing-key.asc

      - name: Download existing APT repo from GCS
        run: |
          mkdir -p repo
          gcloud storage rsync -r gs://${{ steps.bucket.outputs.name }}/ repo/ || true

      - name: Add new packages to pool
        run: |
          # Package filenames encode the codename: zmap_VERSION_CODENAME_ARCH.deb
          for deb in new-debs/*.deb; do
            filename=$(basename "$deb")
            codename=$(echo "$filename" | cut -d_ -f3)
            mkdir -p "repo/pool/${codename}/main/z/zmap"
            cp "$deb" "repo/pool/${codename}/main/z/zmap/"
          done

      - name: Generate Packages indexes and Release files
        run: |
          for CODENAME in $(ls repo/pool/); do
            for ARCH in amd64 arm64; do
              mkdir -p "repo/dists/${CODENAME}/main/binary-${ARCH}"
              (cd repo && dpkg-scanpackages --arch "${ARCH}" "pool/${CODENAME}/main") \
                > "repo/dists/${CODENAME}/main/binary-${ARCH}/Packages"
              gzip -c "repo/dists/${CODENAME}/main/binary-${ARCH}/Packages" \
                > "repo/dists/${CODENAME}/main/binary-${ARCH}/Packages.gz"
            done

            {
              echo "Origin: ZMap"
              echo "Label: ZMap"
              echo "Suite: ${CODENAME}"
              echo "Codename: ${CODENAME}"
              echo "Architectures: amd64 arm64"
              echo "Components: main"
              echo "Description: ZMap APT Repository"
              echo "Date: $(date -u '+%a, %d %b %Y %H:%M:%S UTC')"
              echo "SHA256:"
              find "repo/dists/${CODENAME}/main" -type f | sort | while read -r f; do
                rel="${f#repo/dists/${CODENAME}/}"
                printf " %s %s %s\n" \
                  "$(sha256sum "$f" | cut -d' ' -f1)" \
                  "$(wc -c < "$f")" \
                  "$rel"
              done
              echo "SHA512:"
              find "repo/dists/${CODENAME}/main" -type f | sort | while read -r f; do
                rel="${f#repo/dists/${CODENAME}/}"
                printf " %s %s %s\n" \
                  "$(sha512sum "$f" | cut -d' ' -f1)" \
                  "$(wc -c < "$f")" \
                  "$rel"
              done
            } > "repo/dists/${CODENAME}/Release"
          done

      - name: Sign Release files
        run: |
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          for release in repo/dists/*/Release; do
            dir=$(dirname "$release")
            rm -f "${dir}/InRelease" "${dir}/Release.gpg"
            gpg --batch --pinentry-mode loopback --default-key "$KEY_ID" \
              --clearsign -o "${dir}/InRelease" "${dir}/Release"
            gpg --batch --pinentry-mode loopback --default-key "$KEY_ID" \
              -abs -o "${dir}/Release.gpg" "${dir}/Release"
          done

      - name: Export public key
        run: gpg --armor --export > repo/gpg.key

      - name: Upload to GCS
        env:
          BUCKET: ${{ steps.bucket.outputs.name }}
        run: |
          # Pool files are immutable once written; never delete old versions
          gcloud storage rsync -r repo/pool gs://${BUCKET}/pool

          # Packages indexes must be live before Release is updated
          for CODENAME in $(ls repo/pool/); do
            gcloud storage cp -r "repo/dists/${CODENAME}/main" \
              "gs://${BUCKET}/dists/${CODENAME}/"
            for f in Release InRelease Release.gpg; do
              gcloud storage cp --cache-control="no-cache, no-store" \
                "repo/dists/${CODENAME}/$f" \
                "gs://${BUCKET}/dists/${CODENAME}/$f"
            done
          done

          gcloud storage cp repo/gpg.key gs://${BUCKET}/gpg.key

  verify-apt:
    needs: [build-deb, publish-apt]
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: amd64
            runner: ubuntu-24.04
          - name: arm64
            runner: ubuntu-24.04-arm
        distro:
          - { image: "ubuntu:20.04",    codename: focal     }
          - { image: "ubuntu:22.04",    codename: jammy     }
          - { image: "ubuntu:24.04",    codename: noble     }
          - { image: "ubuntu:26.04",    codename: resolute  }
          - { image: "debian:bullseye", codename: bullseye  }
          - { image: "debian:bookworm", codename: bookworm  }
          - { image: "debian:trixie",   codename: trixie    }
          - { image: "debian:forky",    codename: forky     }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - name: Set target bucket URL
        id: bucket
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "url=https://storage.googleapis.com/zmap-apt-repo" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://storage.googleapis.com/zmap-apt-repo-staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package installs and version matches
        run: |
          EXPECTED="${{ needs.build-deb.outputs.version }}"
          BUCKET="${{ steps.bucket.outputs.url }}"
          docker run --rm \
            -e "EXPECTED_VERSION=${EXPECTED}" \
            "${{ matrix.distro.image }}" \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y curl gpg
              curl -fsSL ${BUCKET}/gpg.key \
                | gpg --dearmor -o /usr/share/keyrings/zmap-archive-keyring.gpg
              echo 'deb [arch=${{ matrix.arch.name }} signed-by=/usr/share/keyrings/zmap-archive-keyring.gpg] ${BUCKET} ${{ matrix.distro.codename }} main' \
                > /etc/apt/sources.list.d/zmap.list
              apt-get update -qq
              apt-get install -y zmap
              INSTALLED=\$(zmap --version 2>&1 | head -1)
              echo \"Installed: \${INSTALLED}\"
              if echo \"\${INSTALLED}\" | grep -qF \"\${EXPECTED_VERSION}\"; then
                echo 'Version check passed'
              else
                echo \"FAIL: expected '\${EXPECTED_VERSION}' in '\${INSTALLED}'\"
                exit 1
              fi
            "
